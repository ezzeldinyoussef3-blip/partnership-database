<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك البحث عن التخصصات</title>
<style>
* { box-sizing: border-box; }
:root {
  --primary:#f58220;
  --primary-dark:#c95f00;
  --background:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#657085;
  --border:#dce3ec;
  --info-background:#eef4ff;
  --info-text:#315b9d;
}
body { margin:0; background:var(--background); color:var(--text); font-family:Arial,Tahoma,sans-serif; }
.container { width:min(1400px,94%); margin:0 auto; padding:40px 0 60px; }
.page-header { display:flex; align-items:center; justify-content:space-between; gap:25px; margin-bottom:28px; }
.header-content { flex:1; }
.subtitle { margin:0 0 8px; color:var(--primary); font-weight:bold; }
h1 { margin:0; color:var(--primary-dark); font-size:clamp(28px,4vw,44px); }
.description { margin:12px 0 0; color:var(--muted); line-height:1.7; }
.results-box { min-width:110px; padding:18px; background:var(--primary); color:white; border-radius:18px; text-align:center; box-shadow:0 12px 25px rgba(245,130,32,.2); }
.results-box span { display:block; font-size:32px; font-weight:bold; }
.results-box small { font-size:14px; }
.search-card { padding:24px; margin-bottom:28px; background:var(--card); border:1px solid var(--border); border-radius:20px; box-shadow:0 8px 25px rgba(23,32,51,.07); }
label { display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-dark); }
.main-search { margin-bottom:20px; }
input,select,button { width:100%; min-height:48px; padding:11px 14px; font:inherit; border-radius:10px; }
input,select { background:#fff; color:var(--text); border:1px solid var(--border); outline:none; }
input:focus,select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(245,130,32,.12); }
.filters-grid { display:grid; grid-template-columns:repeat(4,minmax(180px,1fr)); gap:16px; }
#resetButton { width:auto; margin-top:20px; padding:11px 22px; border:0; background:var(--primary); color:white; cursor:pointer; font-weight:bold; transition:.2s ease; }
#resetButton:hover { background:var(--primary-dark); }
.results-grid { display:grid; grid-template-columns:repeat(2,minmax(300px,1fr)); gap:20px; }
.result-card { overflow:hidden; background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:0 8px 22px rgba(23,32,51,.07); transition:.2s ease; }
.result-card:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(23,32,51,.11); }
.card-header { padding:20px; background:linear-gradient(135deg,#f58220,#ff9f43); color:white; }
.card-header h2 { margin:0 0 8px; font-size:22px; line-height:1.5; }
.card-header p { margin:0; opacity:.96; line-height:1.6; font-weight:bold; }
.card-body { padding:20px; }
.data-grid { display:grid; grid-template-columns:repeat(2,minmax(140px,1fr)); gap:15px; }
.data-item { padding:14px; background:#f8fafc; border:1px solid #e8edf3; border-radius:12px; }
.data-item span { display:block; margin-bottom:6px; color:var(--muted); font-size:13px; }
.data-item strong { display:block; line-height:1.65; overflow-wrap:anywhere; }
.level-badge { display:inline-block; width:fit-content; margin-top:7px; padding:5px 9px; background:var(--info-background); color:var(--info-text); border-radius:20px; font-size:12px; font-weight:bold; }
.empty-state,.error-state { display:none; padding:45px 20px; background:white; border:1px solid var(--border); border-radius:18px; text-align:center; }
.empty-state h2,.error-state h2 { margin-top:0; }
.empty-state h2 { color:var(--primary-dark); }
.empty-state p,.error-state p { margin-bottom:0; color:var(--muted); }
.load-more-button { display:block; margin:26px auto; padding:12px 30px; border:1px solid var(--primary); border-radius:12px; background:#fff8f1; color:#9c4300; font:inherit; font-weight:700; cursor:pointer; width:auto; }
.load-more-button:hover { background:#ffe9d3; }
@media (max-width:1050px) { .filters-grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:950px) { .results-grid { grid-template-columns:1fr; } }
@media (max-width:600px) {
  .container { width:92%; padding-top:25px; }
  .page-header { align-items:stretch; flex-direction:column; }
  .results-box { width:100%; }
  .filters-grid,.data-grid { grid-template-columns:1fr; }
  #resetButton { width:100%; }
}
</style>
</head>
<body>
<main id="mainWebsite" class="container">
  <header class="page-header">
    <div class="header-content">
      <p class="subtitle">دليل الشراكات التعليمية مع دايركت</p>
      <h1>محرك البحث عن التخصصات</h1>
      <p class="description">ابحث عن التخصص، ثم اعرف الجامعة والشراكة والدرجة الدراسية.</p>
    </div>
    <div class="results-box"><span id="resultCount">0</span><small>نتيجة</small></div>
  </header>

  <section class="search-card">
    <div class="main-search">
      <label for="searchInput">ابحث</label>
      <input type="search" id="searchInput" placeholder="مثال: Computer Science أو Business أو Liverpool" autocomplete="off">
    </div>
    <div class="filters-grid">
      <div class="filter-group">
        <label for="specializationFilter">التخصص</label>
        <select id="specializationFilter"><option value="">كل التخصصات</option></select>
      </div>
      <div class="filter-group">
        <label for="degreeLevelFilter">الدرجة</label>
        <select id="degreeLevelFilter">
          <option value="">كل الدرجات</option>
          <option value="Bachelor">بكالوريوس</option>
          <option value="Master">ماجستير</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="partnershipFilter">الشراكة</label>
        <select id="partnershipFilter"><option value="">كل الشراكات</option></select>
      </div>
      <div class="filter-group">
        <label for="universityFilter">الجامعة</label>
        <select id="universityFilter"><option value="">كل الجامعات</option></select>
      </div>
    </div>
    <button type="button" id="resetButton">مسح البحث والفلاتر</button>
  </section>

  <section id="cardsContainer" class="results-grid"></section>
  <section id="emptyState" class="empty-state">
    <h2>لا توجد نتائج مطابقة</h2>
    <p>جرّب كتابة اسم تخصص أو جامعة أخرى أو إزالة بعض الفلاتر.</p>
  </section>
  <section id="errorState" class="error-state">
    <h2>حدث خطأ أثناء تحميل البيانات</h2>
    <p>راجع ملف HTML والبيانات المضمّنة بداخله.</p>
  </section>
</main>

lization":"Education","degree":"BA/BS Education","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Family and Human Services","degree":"BA/BS Family and Human Services","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Business Administration (Pre-Major)","degree":"BA/BS Business Administration (Pre-Major)","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Advertising","degree":"BA/BS Advertising","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Journalism","degree":"BA/BS Journalism","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Media Studies","degree":"BA/BS Media Studies","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Public Relations","degree":"BA/BS Public Relations","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Dance","degree":"BA/BS/BFA Dance","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Music (Pre-Major)","degree":"BA/BS Music (Pre-Major)","degreeLevel":"Bachelor"},{"partnership":"Kaplan","university":"University of Oregon","specialization":"Child Behavioral Health (Pre-Major)","degree":"BA/BS Child Behavioral Health (Pre-Major)","degreeLevel":"Bachelor"}]</script>
<script>
const searchInput=document.getElementById('searchInput');
const specializationFilter=document.getElementById('specializationFilter');
const degreeLevelFilter=document.getElementById('degreeLevelFilter');
const partnershipFilter=document.getElementById('partnershipFilter');
const universityFilter=document.getElementById('universityFilter');
const resetButton=document.getElementById('resetButton');
const cardsContainer=document.getElementById('cardsContainer');
const resultCount=document.getElementById('resultCount');
const emptyState=document.getElementById('emptyState');
const errorState=document.getElementById('errorState');

const PAGE_SIZE=60;
let visibleCount=PAGE_SIZE;
let activeFilteredPrograms=[];
let programs=[];

try {
  programs=JSON.parse(document.getElementById('embeddedPrograms').textContent);
  createFilterOptions();
  filterPrograms();
} catch(error) {
  console.error('Data loading error:',error);
  cardsContainer.innerHTML='';
  emptyState.style.display='none';
  errorState.style.display='block';
  resultCount.textContent='0';
}

function createFilterOptions() {
  addOptions(specializationFilter,getUniqueValues('specialization',true));
  addOptions(partnershipFilter,getUniqueValues('partnership'));
  addOptions(universityFilter,getUniqueValues('university'));
}

function getUniqueValues(propertyName,removeAllSpecializations=false) {
  return [...new Set(programs.map(item=>item[propertyName]).filter(Boolean).filter(value=>!(removeAllSpecializations && value==='All Specializations')))]
    .sort((a,b)=>String(a).localeCompare(String(b),undefined,{sensitivity:'base'}));
}

function addOptions(selectElement,values) {
  values.forEach(value=>{
    const option=document.createElement('option');
    option.value=value;
    option.textContent=value;
    selectElement.appendChild(option);
  });
}

function filterPrograms() {
  const searchValue=normalizeSearchText(searchInput.value);
  const selectedSpecialization=specializationFilter.value;
  const selectedDegreeLevel=degreeLevelFilter.value;
  const selectedPartnership=partnershipFilter.value;
  const selectedUniversity=universityFilter.value;

  const filteredPrograms=programs.filter(item=>{
    const searchableContent=normalizeSearchText(`
      ${item.specialization||''}
      ${item.degree||''}
      ${item.degreeLevel||''}
      ${item.partnership||''}
      ${item.university||''}
    `);
    return (
      (searchValue==='' || searchableContent.includes(searchValue)) &&
      (selectedSpecialization==='' || item.specialization===selectedSpecialization) &&
      (selectedDegreeLevel==='' || item.degreeLevel===selectedDegreeLevel) &&
      (selectedPartnership==='' || item.partnership===selectedPartnership) &&
      (selectedUniversity==='' || item.university===selectedUniversity)
    );
  });

  visibleCount=PAGE_SIZE;
  activeFilteredPrograms=filteredPrograms;
  displayPrograms(filteredPrograms);
}

function displayPrograms(data) {
  const oldButton=document.getElementById('loadMoreButton');
  if(oldButton) oldButton.remove();
  cardsContainer.innerHTML='';
  resultCount.textContent=data.length;

  if(data.length===0) {
    emptyState.style.display='block';
    errorState.style.display='none';
    return;
  }
  emptyState.style.display='none';
  errorState.style.display='none';

  data.slice(0,visibleCount).forEach(item=>{
    const card=document.createElement('article');
    card.className='result-card';
    const degreeText=hasValue(item.degree) ? item.degree : getDegreeLevelLabel(item.degreeLevel);
    const levelLabel=getDegreeLevelLabel(item.degreeLevel);
    card.innerHTML=`
      <div class="card-header">
        <h2>${escapeHTML(item.specialization||'غير محدد')}</h2>
        <p>${escapeHTML(item.university||'غير محدد')}</p>
      </div>
      <div class="card-body">
        <div class="data-grid">
          <div class="data-item">
            <span>الشراكة</span>
            <strong>${escapeHTML(item.partnership||'غير محدد')}</strong>
          </div>
          <div class="data-item">
            <span>الدرجة</span>
            <strong>${escapeHTML(degreeText||'غير محدد')}</strong>
            ${item.degreeLevel ? `<span class="level-badge">${escapeHTML(levelLabel)}</span>` : ''}
          </div>
        </div>
      </div>`;
    cardsContainer.appendChild(card);
  });

  if(data.length>visibleCount) {
    const loadMore=document.createElement('button');
    loadMore.type='button';
    loadMore.id='loadMoreButton';
    loadMore.className='load-more-button';
    loadMore.textContent=`عرض المزيد (${Math.min(visibleCount,data.length)} من ${data.length})`;
    loadMore.addEventListener('click',()=>{
      visibleCount+=PAGE_SIZE;
      displayPrograms(activeFilteredPrograms);
    });
    cardsContainer.insertAdjacentElement('afterend',loadMore);
  }
}

function getDegreeLevelLabel(level) {
  if(level==='Bachelor') return 'بكالوريوس';
  if(level==='Master') return 'ماجستير';
  return 'غير محدد';
}

function normalizeSearchText(value) {
  return String(value||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
}

function escapeHTML(value) {
  const div=document.createElement('div');
  div.textContent=value===null || value===undefined || value==='' ? '-' : String(value);
  return div.innerHTML;
}

function hasValue(value) {
  if(value===null || value===undefined) return false;
  const text=String(value).trim();
  if(text==='') return false;
  const placeholders=['سيتم إضافته','سيتم اضافه','to be added'];
  return !placeholders.map(normalizeSearchText).includes(normalizeSearchText(text));
}

function resetFilters() {
  searchInput.value='';
  specializationFilter.value='';
  degreeLevelFilter.value='';
  partnershipFilter.value='';
  universityFilter.value='';
  filterPrograms();
  searchInput.focus();
}

searchInput.addEventListener('input',filterPrograms);
specializationFilter.addEventListener('change',filterPrograms);
degreeLevelFilter.addEventListener('change',filterPrograms);
partnershipFilter.addEventListener('change',filterPrograms);
universityFilter.addEventListener('change',filterPrograms);
resetButton.addEventListener('click',resetFilters);
</script>
