<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>محرك البحث عن التخصصات</title>

    <style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #f58220;
    --primary-dark: #c95f00;

    --background: #f4f7fb;
    --card: #ffffff;

    --text: #172033;
    --muted: #657085;

    --border: #dce3ec;

    --success-background: #e7f7ed;
    --success-text: #146c3d;

    --danger-background: #fdecec;
    --danger-text: #a22a2a;

    --warning-background: #fff5d9;
    --warning-text: #8a5a00;

    --info-background: #eef4ff;
    --info-text: #315b9d;
}


body {
    margin: 0;

    background: var(--background);

    color: var(--text);

    font-family: Arial, Tahoma, sans-serif;
}


.container {
    width: min(1400px, 94%);

    margin: 0 auto;

    padding: 40px 0 60px;
}


/* Header */

.page-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 25px;

    margin-bottom: 28px;
}


.header-content {
    flex: 1;
}


.subtitle {
    margin: 0 0 8px;

    color: var(--primary);

    font-weight: bold;
}


h1 {
    margin: 0;

    color: var(--primary-dark);

    font-size: clamp(28px, 4vw, 44px);
}


.description {
    margin: 12px 0 0;

    color: var(--muted);

    line-height: 1.7;
}


.results-box {
    min-width: 110px;

    padding: 18px;

    background: var(--primary);

    color: white;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 12px 25px rgba(245, 130, 32, 0.2);
}


.results-box span {
    display: block;

    font-size: 32px;

    font-weight: bold;
}


.results-box small {
    font-size: 14px;
}


/* Search */

.search-card {
    padding: 24px;

    margin-bottom: 28px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    box-shadow: 0 8px 25px rgba(23, 32, 51, 0.07);
}


label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: var(--primary-dark);
}


.main-search {
    margin-bottom: 20px;
}


input,
select,
button {
    width: 100%;

    min-height: 48px;

    padding: 11px 14px;

    font: inherit;

    border-radius: 10px;
}


input,
select {
    background: white;

    color: var(--text);

    border: 1px solid var(--border);

    outline: none;
}


input:focus,
select:focus {
    border-color: var(--primary);

    box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.12);
}


.filters-grid {
    display: grid;

    grid-template-columns: repeat(3, minmax(180px, 1fr));

    gap: 16px;
}


#resetButton {
    width: auto;

    margin-top: 20px;

    padding: 11px 22px;

    border: 0;

    background: var(--primary);

    color: white;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s ease;
}


#resetButton:hover {
    background: var(--primary-dark);
}


/* Results */

.results-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(300px, 1fr));

    gap: 20px;
}


.result-card {
    overflow: hidden;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    box-shadow: 0 8px 22px rgba(23, 32, 51, 0.07);

    transition: 0.2s ease;
}


.result-card:hover {
    transform: translateY(-2px);

    box-shadow: 0 12px 28px rgba(23, 32, 51, 0.11);
}


.card-header {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 15px;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #f58220,
            #ff9f43
        );

    color: white;
}


.card-header h2 {
    margin: 0 0 7px;

    font-size: 22px;

    line-height: 1.5;
}


.card-header p {
    margin: 0;

    opacity: 0.95;

    line-height: 1.5;
}


.card-university {
    margin-top: 6px !important;

    font-weight: bold;
}


.country-badge {
    white-space: nowrap;

    padding: 7px 11px;

    background: rgba(255, 255, 255, 0.17);

    border-radius: 20px;

    font-size: 14px;
}


.card-body {
    padding: 20px;
}


.degree-title-box {
    margin-bottom: 18px;

    padding: 15px;

    background: #fff8f1;

    border: 1px solid #ffe0c2;

    border-radius: 12px;
}


.degree-title-box span {
    display: block;

    margin-bottom: 6px;

    color: var(--muted);

    font-size: 13px;
}


.degree-title-box strong {
    display: block;

    line-height: 1.6;
}


/* Data */

.data-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(140px, 1fr));

    gap: 15px;
}


.data-item {
    padding: 13px;

    background: #f8fafc;

    border: 1px solid #e8edf3;

    border-radius: 12px;
}


.data-item span {
    display: block;

    margin-bottom: 6px;

    color: var(--muted);

    font-size: 13px;
}


.data-item strong {
    display: block;

    line-height: 1.6;

    overflow-wrap: anywhere;
}


.full-width {
    grid-column: 1 / -1;
}


.level-badge {
    display: inline-block !important;

    width: fit-content;

    padding: 6px 10px;

    background: var(--info-background);

    color: var(--info-text);

    border-radius: 20px;

    font-size: 13px;
}


.scholarship-badge {
    display: inline-block !important;

    width: fit-content;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 13px;

    font-weight: bold;
}


.supported {
    background: var(--success-background);

    color: var(--success-text);
}


.not-supported {
    background: var(--danger-background);

    color: var(--danger-text);
}


.to-be-confirmed {
    background: var(--warning-background);

    color: var(--warning-text);
}


/* Requirements */

.requirements-section {
    margin-top: 18px;

    padding: 16px;

    background: #fffdf8;

    border: 1px solid #f1e2cf;

    border-radius: 14px;
}


.requirements-section h3 {
    margin: 0 0 14px;

    color: var(--primary-dark);

    font-size: 17px;
}


.requirements-grid {
    display: grid;

    grid-template-columns: repeat(2, minmax(150px, 1fr));

    gap: 12px;
}


.requirement-item {
    padding: 12px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 10px;
}


.requirement-item span {
    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 13px;
}


.requirement-item strong {
    display: block;

    line-height: 1.6;
}


/* Notes */

.notes-box {
    margin-top: 15px;

    padding: 13px;

    background: #fffdf5;

    border: 1px solid #f1e7bf;

    border-radius: 12px;
}


.notes-box span {
    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 13px;
}


.notes-box strong {
    line-height: 1.7;
}


/* States */

.empty-state,
.error-state {
    display: none;

    padding: 45px 20px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;

    text-align: center;
}


.empty-state h2,
.error-state h2 {
    margin-top: 0;
}


.empty-state h2 {
    color: var(--primary-dark);
}


.empty-state p,
.error-state p {
    margin-bottom: 0;

    color: var(--muted);
}


.error-state {
    color: var(--danger-text);
}


/* Responsive */

@media (max-width: 950px) {

    .filters-grid {
        grid-template-columns: repeat(2, 1fr);
    }


    .results-grid {
        grid-template-columns: 1fr;
    }

}


@media (max-width: 600px) {

    .container {
        width: 92%;

        padding-top: 25px;
    }


    .page-header {
        align-items: stretch;

        flex-direction: column;
    }


    .results-box {
        width: 100%;
    }


    .filters-grid,
    .data-grid,
    .requirements-grid {
        grid-template-columns: 1fr;
    }


    .card-header {
        flex-direction: column;
    }


    #resetButton {
        width: 100%;
    }

}

/* Batch rendering for an expanded list of partners. */
.load-more-button {
    display: block;
    margin: 26px auto;
    padding: 12px 30px;
    border: 1px solid #f58220;
    border-radius: 12px;
    background: #fff8f1;
    color: #9c4300;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
}
.load-more-button:hover { background: #ffe9d3; }

</style>
</head>

<body>

    <main
        id="mainWebsite"
        class="container"
    >

        <header class="page-header">

            <div class="header-content">

                <p class="subtitle">
                    دليل الشراكات التعليمية مع دايركت
                </p>

                <h1>
                    محرك البحث عن التخصصات
                </h1>

                <p class="description">
                    ابحث عن التخصص، ثم اعرف الجامعات والشراكات والمتطلبات المتاحة.
                </p>

            </div>

            <div class="results-box">

                <span id="resultCount">0</span>

                <small>
                    نتيجة
                </small>

            </div>

        </header>


        <section class="search-card">

            <div class="main-search">

                <label for="searchInput">
                    ابحث
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="مثال: Computer Science أو Business أو Liverpool"
                    autocomplete="off"
                >

            </div>


            <div class="filters-grid">

                <div class="filter-group">

                    <label for="specializationFilter">
                        التخصص
                    </label>

                    <select id="specializationFilter">

                        <option value="">
                            كل التخصصات
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="degreeLevelFilter">
                        الدرجة الدراسية
                    </label>

                    <select id="degreeLevelFilter">

                        <option value="">
                            كل الدرجات
                        </option>

                        <option value="Bachelor">
                            بكالوريوس
                        </option>

                        <option value="Master">
                            ماجستير
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="countryFilter">
                        الدولة
                    </label>

                    <select id="countryFilter">

                        <option value="">
                            كل الدول
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="partnershipFilter">
                        الشراكة
                    </label>

                    <select id="partnershipFilter">

                        <option value="">
                            كل الشراكات
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="universityFilter">
                        الجامعة
                    </label>

                    <select id="universityFilter">

                        <option value="">
                            كل الجامعات
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="scholarshipFilter">
                        دعم الابتعاث
                    </label>

                    <select id="scholarshipFilter">

                        <option value="">
                            الكل
                        </option>

                        <option value="Supported">
                            مدعوم
                        </option>

                        <option value="Not Supported">
                            غير مدعوم
                        </option>

                        <option value="To be confirmed">
                            غير مؤكد
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="button"
                id="resetButton"
            >
                مسح البحث والفلاتر
            </button>

        </section>


        <section
            id="cardsContainer"
            class="results-grid"
        ></section>


        <section
            id="emptyState"
            class="empty-state"
        >

            <h2>
                لا توجد نتائج مطابقة
            </h2>

            <p>
                جرّب كتابة اسم تخصص أو جامعة أخرى أو إزالة بعض الفلاتر.
            </p>

        </section>


        <section
            id="errorState"
            class="error-state"
        >

            <h2>
                حدث خطأ أثناء تحميل البيانات
            </h2>

            <p>
                راجع ملف HTML والبيانات المضمّنة بداخله.
            </p>

        </section>

    </main>

<script>
const searchInput =
    document.getElementById("searchInput");

const specializationFilter =
    document.getElementById("specializationFilter");

const degreeLevelFilter =
    document.getElementById("degreeLevelFilter");

const countryFilter =
    document.getElementById("countryFilter");

const partnershipFilter =
    document.getElementById("partnershipFilter");

const universityFilter =
    document.getElementById("universityFilter");

const scholarshipFilter =
    document.getElementById("scholarshipFilter");

const resetButton =
    document.getElementById("resetButton");

const cardsContainer =
    document.getElementById("cardsContainer");

const resultCount =
    document.getElementById("resultCount");

const emptyState =
    document.getElementById("emptyState");

const errorState =
    document.getElementById("errorState");


let programs = [];

// Display matching results in batches for the expanded portfolio.
const PAGE_SIZE = 60;
let visibleCount = PAGE_SIZE;
let activeFilteredPrograms = [];


/* =========================================
   Load Data
========================================= */

Promise.resolve({ok:true,json:()=>Promise.resolve(JSON.parse(document.getElementById("embeddedPartnerships").textContent))})

    .then((response) => {

        if (!response.ok) {

            throw new Error(
                `Failed to load data: ${response.status}`
            );

        }

        return response.json();

    })

    .then((data) => {

        if (!Array.isArray(data)) {

            throw new Error(
                "partnerships.json must contain an array"
            );

        }

        programs = normalizeData(data);

        createFilterOptions();

        filterPrograms();

    })

    .catch((error) => {

        console.error(
            "Data loading error:",
            error
        );

        cardsContainer.innerHTML = "";

        emptyState.style.display =
            "none";

        errorState.style.display =
            "block";

        resultCount.textContent =
            "0";

    });


/* =========================================
   Normalize Data
========================================= */

function normalizeData(data) {

    const normalizedPrograms = [];


    data.forEach((item) => {

        if (Array.isArray(item.degrees)) {

            item.degrees.forEach((degree) => {

                normalizedPrograms.push(
                    createNormalizedProgram(
                        item,
                        degree
                    )
                );

            });

        } else {

            normalizedPrograms.push(
                createNormalizedProgram(
                    item,
                    item
                )
            );

        }

    });


    return normalizedPrograms;

}


/* =========================================
   Create normalized program
========================================= */

function createNormalizedProgram(
    parent,
    degree
) {

    const degreeName =
        degree.name ||
        degree.degree ||
        parent.degree ||
        "";


    const programName =
        degree.program ||
        degree.level ||
        parent.program ||
        "";


    const languageRequirements =
        degree.languageRequirements ||
        parent.languageRequirements ||
        getLanguageFromOptions(
            degree.englishOptions ||
            parent.englishOptions
        ) ||
        "";


    const gpaRequirement =
        degree.gpaRequirement ||
        parent.gpaRequirement ||
        getAcademicRequirement(
            degree.academicRequirements ||
            parent.academicRequirements
        ) ||
        "";


    return {

        partnership:
            parent.partnership ||
            degree.partnership ||
            "",


        country:
            parent.country ||
            degree.country ||
            "",


        university:
            parent.university ||
            degree.university ||
            "",


        specialization:
            degree.specialization ||
            degree.subject ||
            parent.specialization ||
            "All Specializations",


        degree:
            degreeName,


        degreeLevel:
            degree.degreeLevel ||
            parent.degreeLevel ||
            getDegreeLevel(
                degreeName,
                programName
            ),


        program:
            programName,


        price:
            degree.price ||
            parent.price ||
            getPriceFromOptions(
                degree.englishOptions ||
                parent.englishOptions
            ) ||
            "",


        scholarshipSupport:
            degree.scholarshipSupport ||
            parent.scholarshipSupport ||
            "To be confirmed",


        languageRequirements:
            languageRequirements,


        gpaRequirement:
            gpaRequirement,


        intake:
            degree.intake ||
            parent.intake ||
            getIntakeFromOptions(
                degree.englishOptions ||
                parent.englishOptions
            ) ||
            "",


        notes:
            [parent.notes, degree === parent ? "" : degree.notes]
                .filter(Boolean)
                .join(" | ")

    };

}


/* =========================================
   Helpers for new data
========================================= */

function getLanguageFromOptions(options) {

    if (
        !Array.isArray(options) ||
        options.length === 0
    ) {

        return "";

    }


    const first =
        options[0];


    let result = "";


    if (
        first.test
    ) {

        result += first.test;

    }


    if (
        first.overall !== undefined &&
        first.overall !== ""
    ) {

        result +=
            ` ${first.overall} overall`;

    }


    const minSkill =
        first.minSkill ??
        first.minimumSkill;


    if (
        minSkill !== undefined &&
        minSkill !== ""
    ) {

        result +=
            `, no skill below ${minSkill}`;

    }


    return result.trim();

}


function getAcademicRequirement(value) {

    if (!value) {

        return "";

    }


    if (
        typeof value === "string"
    ) {

        return value;

    }


    return (
        value.general ||
        value.academic ||
        ""
    );

}


function getPriceFromOptions(options) {

    if (
        !Array.isArray(options) ||
        options.length === 0
    ) {

        return "";

    }


    const first =
        options[0];


    if (
        first.tuition === undefined ||
        first.tuition === ""
    ) {

        return "";

    }


    return formatPrice(
        first.tuition,
        first.currency || "GBP"
    );

}


function getIntakeFromOptions(options) {

    if (
        !Array.isArray(options) ||
        options.length === 0
    ) {

        return "";

    }


    return (
        options[0].start ||
        options[0].startDate ||
        ""
    );

}


/* =========================================
   Degree Level
========================================= */

function getDegreeLevel(
    degreeName,
    programName
) {

    const degree =
        normalizeText(degreeName);

    const program =
        normalizeText(programName);


    if (
        program.includes("postgraduate") ||
        program.includes("pre-master") ||
        program.includes("pre master")
    ) {

        return "Master";

    }


    if (
        program.includes("undergraduate") ||
        program.includes("foundation") ||
        program.includes("international year one")
    ) {

        return "Bachelor";

    }


    const masterPrefixes = [

        "msc ",
        "msc(",
        "ma ",
        "ma(",
        "mba",
        "llm",
        "master"

    ];


    if (
        masterPrefixes.some(
            (prefix) =>
                degree.startsWith(prefix)
        )
    ) {

        return "Master";

    }


    const bachelorPrefixes = [

        "bsc",
        "ba ",
        "ba(",
        "beng",
        "llb",
        "bmus",
        "bnurs",
        "basc",
        "barch",
        "bba",
        "meng",
        "msci",
        "mphys",
        "mmath",
        "mchem",
        "mbiol",
        "mbiochem",
        "mbiomedsci",
        "menv",
        "marts",
        "mpharm",
        "bachelor"

    ];


    if (
        bachelorPrefixes.some(
            (prefix) =>
                degree.startsWith(prefix)
        )
    ) {

        return "Bachelor";

    }


    return "";

}


/* =========================================
   Filters
========================================= */

function createFilterOptions() {

    clearGeneratedOptions(
        specializationFilter
    );

    clearGeneratedOptions(
        countryFilter
    );

    clearGeneratedOptions(
        partnershipFilter
    );

    clearGeneratedOptions(
        universityFilter
    );


    addOptions(

        specializationFilter,

        getUniqueValues(
            "specialization",
            true
        )

    );


    addOptions(

        countryFilter,

        getUniqueValues(
            "country"
        )

    );


    addOptions(

        partnershipFilter,

        getUniqueValues(
            "partnership"
        )

    );


    addOptions(

        universityFilter,

        getUniqueValues(
            "university"
        )

    );

}


function clearGeneratedOptions(
    selectElement
) {

    while (
        selectElement.options.length > 1
    ) {

        selectElement.remove(1);

    }

}


function getUniqueValues(
    propertyName,
    removeAllSpecializations = false
) {

    return [

        ...new Set(

            programs

                .map(
                    (item) =>
                        item[propertyName]
                )

                .filter(Boolean)

                .filter((value) => {

                    if (
                        removeAllSpecializations &&
                        value === "All Specializations"
                    ) {

                        return false;

                    }

                    return true;

                })

        )

    ].sort(

        (a, b) =>

            String(a).localeCompare(

                String(b),

                undefined,

                {
                    sensitivity: "base"
                }

            )

    );

}


function addOptions(
    selectElement,
    values
) {

    values.forEach((value) => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            value;


        option.textContent =
            value;


        selectElement.appendChild(
            option
        );

    });

}


/* =========================================
   Search and filter
========================================= */

function filterPrograms() {

    const searchValue =
        normalizeSearchText(
            searchInput.value
        );


    const selectedSpecialization =
        specializationFilter.value;


    const selectedDegreeLevel =
        degreeLevelFilter.value;


    const selectedCountry =
        countryFilter.value;


    const selectedPartnership =
        partnershipFilter.value;


    const selectedUniversity =
        universityFilter.value;


    const selectedScholarship =
        scholarshipFilter.value;


    const filteredPrograms =
        programs.filter((item) => {


            const searchableContent =
                normalizeSearchText(`

                    ${item.specialization || ""}

                    ${item.degree || ""}

                    ${item.degreeLevel || ""}

                    ${item.partnership || ""}

                    ${item.country || ""}

                    ${item.university || ""}

                    ${item.program || ""}

                    ${item.languageRequirements || ""}

                    ${item.gpaRequirement || ""}

                    ${item.intake || ""}

                    ${item.notes || ""}

                `);


            const matchesSearch =

                searchValue === "" ||

                searchableContent.includes(
                    searchValue
                );


            const matchesSpecialization =

                selectedSpecialization === "" ||

                item.specialization ===
                    selectedSpecialization;


            const matchesDegreeLevel =

                selectedDegreeLevel === "" ||

                item.degreeLevel ===
                    selectedDegreeLevel;


            const matchesCountry =

                selectedCountry === "" ||

                item.country ===
                    selectedCountry;


            const matchesPartnership =

                selectedPartnership === "" ||

                item.partnership ===
                    selectedPartnership;


            const matchesUniversity =

                selectedUniversity === "" ||

                item.university ===
                    selectedUniversity;


            const matchesScholarship =

                selectedScholarship === "" ||

                item.scholarshipSupport ===
                    selectedScholarship;


            return (

                matchesSearch &&

                matchesSpecialization &&

                matchesDegreeLevel &&

                matchesCountry &&

                matchesPartnership &&

                matchesUniversity &&

                matchesScholarship

            );

        });


    visibleCount = PAGE_SIZE;
    activeFilteredPrograms = filteredPrograms;
    displayPrograms(
        filteredPrograms
    );

}


/* =========================================
   Display
========================================= */

function displayPrograms(data) {

    const oldButton = document.getElementById("loadMoreButton");
    if (oldButton) oldButton.remove();

    cardsContainer.innerHTML =
        "";


    resultCount.textContent =
        data.length;


    if (
        data.length === 0
    ) {

        emptyState.style.display =
            "block";

        errorState.style.display =
            "none";

        return;

    }


    emptyState.style.display =
        "none";

    errorState.style.display =
        "none";


    data.slice(0, visibleCount).forEach((item) => {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "result-card";


        card.innerHTML = `

            <div class="card-header">

                <div>

                    <h2>
                        ${escapeHTML(
                            item.specialization
                        )}
                    </h2>

                    <p>
                        ${escapeHTML(
                            item.partnership
                        )}
                    </p>

                    ${
                        hasValue(item.university)
                            ? `
                                <p class="card-university">
                                    ${escapeHTML(
                                        item.university
                                    )}
                                </p>
                            `
                            : ""
                    }

                </div>


                <span class="country-badge">

                    ${escapeHTML(
                        item.country || "غير محدد"
                    )}

                </span>

            </div>


            <div class="card-body">


                ${
                    hasValue(item.degree)
                        ? `

                            <div class="degree-title-box">

                                <span>
                                    الدرجة / البرنامج
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        item.degree
                                    )}
                                </strong>

                            </div>

                        `
                        : ""
                }


                <div class="data-grid">


                    <div class="data-item">

                        <span>
                            الدرجة الدراسية
                        </span>

                        <strong
                            class="level-badge"
                        >

                            ${getDegreeLevelLabel(
                                item.degreeLevel
                            )}

                        </strong>

                    </div>


                    ${
                        hasValue(item.program)
                            ? `

                                <div class="data-item">

                                    <span>
                                        المرحلة / البرنامج
                                    </span>

                                    <strong>

                                        ${escapeHTML(
                                            item.program
                                        )}

                                    </strong>

                                </div>

                            `
                            : ""
                    }


                    ${
                        hasValue(item.price)
                            ? `

                                <div class="data-item">

                                    <span>
                                        الرسوم الدراسية
                                    </span>

                                    <strong>

                                        ${escapeHTML(
                                            item.price
                                        )}

                                    </strong>

                                </div>

                            `
                            : ""
                    }


                    ${
                        hasValue(item.intake)
                            ? `

                                <div class="data-item">

                                    <span>
                                        موعد الدراسة
                                    </span>

                                    <strong>

                                        ${escapeHTML(
                                            item.intake
                                        )}

                                    </strong>

                                </div>

                            `
                            : ""
                    }


                    <div class="data-item">

                        <span>
                            دعم الابتعاث
                        </span>

                        <strong
                            class="
                                scholarship-badge
                                ${getScholarshipClass(
                                    item.scholarshipSupport
                                )}
                            "
                        >

                            ${getScholarshipLabel(
                                item.scholarshipSupport
                            )}

                        </strong>

                    </div>


                </div>


                <div class="requirements-section">

                    <h3>
                        متطلبات القبول
                    </h3>


                    <div class="requirements-grid">

                        <div class="requirement-item">

                            <span>
                                متطلبات اللغة
                            </span>

                            <strong>

                                ${getRequirementValue(
                                    item.languageRequirements
                                )}

                            </strong>

                        </div>


                        <div class="requirement-item">

                            <span>
                                المعدل المطلوب
                            </span>

                            <strong>

                                ${getRequirementValue(
                                    item.gpaRequirement
                                )}

                            </strong>

                        </div>

                    </div>

                </div>


                ${
                    hasValue(item.notes)
                        ? `

                            <div class="notes-box">

                                <span>
                                    ملاحظات
                                </span>

                                <strong>

                                    ${escapeHTML(
                                        item.notes
                                    )}

                                </strong>

                            </div>

                        `
                        : ""
                }


            </div>

        `;


        cardsContainer.appendChild(
            card
        );

    });

    if (data.length > visibleCount) {
        const loadMore = document.createElement("button");
        loadMore.type = "button";
        loadMore.id = "loadMoreButton";
        loadMore.className = "load-more-button";
        loadMore.textContent = `عرض المزيد (${Math.min(visibleCount, data.length)} من ${data.length})`;
        loadMore.addEventListener("click", () => {
            visibleCount += PAGE_SIZE;
            displayPrograms(activeFilteredPrograms);
        });
        cardsContainer.insertAdjacentElement("afterend", loadMore);
    }
}


/* =========================================
   Requirement display
========================================= */

function getRequirementValue(value) {

    if (
        !hasValue(value)
    ) {

        return "سيتم إضافة المتطلبات";

    }


    return escapeHTML(value);

}


/* =========================================
   Degree Level
========================================= */

function getDegreeLevelLabel(level) {

    if (
        level === "Bachelor"
    ) {

        return "بكالوريوس";

    }


    if (
        level === "Master"
    ) {

        return "ماجستير";

    }


    return "غير محدد";

}


/* =========================================
   Scholarship
========================================= */

function getScholarshipClass(status) {

    if (
        status === "Supported"
    ) {

        return "supported";

    }


    if (
        status === "Not Supported"
    ) {

        return "not-supported";

    }


    return "to-be-confirmed";

}


function getScholarshipLabel(status) {

    if (
        status === "Supported"
    ) {

        return "مدعوم";

    }


    if (
        status === "Not Supported"
    ) {

        return "غير مدعوم";

    }


    return "غير مؤكد";

}


/* =========================================
   Price
========================================= */

function formatPrice(
    price,
    currency
) {

    if (
        price === "" ||
        price === null ||
        price === undefined
    ) {

        return "";

    }


    if (
        typeof price !== "number"
    ) {

        return String(price);

    }


    const formatted =
        new Intl.NumberFormat(
            "en-GB"
        ).format(price);


    if (
        currency === "GBP"
    ) {

        return `£${formatted}`;

    }


    if (
        currency === "USD"
    ) {

        return `$${formatted}`;

    }


    if (
        currency === "EUR"
    ) {

        return `€${formatted}`;

    }


    return `${formatted} ${currency || ""}`;

}


/* =========================================
   Helpers
========================================= */

function normalizeText(value) {

    return String(
        value || ""
    )
        .toLowerCase()
        .trim();

}


function normalizeSearchText(value) {

    return String(
        value || ""
    )

        .toLowerCase()

        .replace(/[أإآ]/g, "ا")

        .replace(/ة/g, "ه")

        .replace(/ى/g, "ي")

        .replace(/\s+/g, " ")

        .trim();

}


function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value === null ||
        value === undefined ||
        value === ""

            ? "-"

            : String(value);


    return div.innerHTML;

}


function hasValue(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return false;

    }


    const text =
        String(value)
            .trim();


    if (
        text === ""
    ) {

        return false;

    }


    const placeholders = [

        "سيتم إضافته",
        "سيتم اضافه",
        "سيتم إضافة السعر",
        "سيتم إضافة المعدل",
        "سيتم إضافة متطلبات اللغة",
        "to be added"

    ];


    return !placeholders
        .map(
            normalizeSearchText
        )
        .includes(
            normalizeSearchText(text)
        );

}


/* =========================================
   Reset
========================================= */

function resetFilters() {

    searchInput.value =
        "";


    specializationFilter.value =
        "";


    degreeLevelFilter.value =
        "";


    countryFilter.value =
        "";


    partnershipFilter.value =
        "";


    universityFilter.value =
        "";


    scholarshipFilter.value =
        "";


    filterPrograms();


    searchInput.focus();

}


/* =========================================
   Events
========================================= */

searchInput.addEventListener(
    "input",
    filterPrograms
);


specializationFilter.addEventListener(
    "change",
    filterPrograms
);


degreeLevelFilter.addEventListener(
    "change",
    filterPrograms
);


countryFilter.addEventListener(
    "change",
    filterPrograms
);


partnershipFilter.addEventListener(
    "change",
    filterPrograms
);


universityFilter.addEventListener(
    "change",
    filterPrograms
);


scholarshipFilter.addEventListener(
    "change",
    filterPrograms
);


resetButton.addEventListener(
    "click",
    resetFilters
);

</script>
