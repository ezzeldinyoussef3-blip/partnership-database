<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partnership Database</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 البحث عن التخصصات والشراكات</h1>

        <div class="filters">

            <select id="specializationFilter">
                <option value="">اختر التخصص</option>
            </select>

            <select id="countryFilter">
                <option value="">كل الدول</option>
            </select>

            <input
                type="text"
                id="search"
                placeholder="اكتب اسم تخصص أو شراكة..."
            >

        </div>

        <p id="resultCount"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>التخصص</th>
                        <th>الشراكة</th>
                        <th>الدولة</th>
                        <th>البرنامج</th>
                        <th>السعر</th>
                        <th>دعم الابتعاث</th>
                        <th>متطلبات اللغة</th>
                        <th>المعدل</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <p id="emptyMessage" class="empty-message">
            لا توجد نتائج مطابقة.
        </p>

    </div>

    <script src="app.js"></script>

</body>
</html>
