<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>محرك البحث عن التخصصات</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main
        id="mainWebsite"
        class="container"
    >

        <header class="page-header">

            <div class="header-content">

                <p class="subtitle">
                    دليل الشراكات التعليمية مع دايركت
                </p>

                <h1>
                    محرك البحث عن التخصصات
                </h1>

                <p class="description">
                    ابحث عن التخصص، ثم اعرف الجامعات والشراكات والمتطلبات المتاحة.
                </p>

            </div>

            <div class="results-box">

                <span id="resultCount">0</span>

                <small>
                    نتيجة
                </small>

            </div>

        </header>


        <section class="search-card">

            <div class="main-search">

                <label for="searchInput">
                    ابحث
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="مثال: Computer Science أو Business أو Liverpool"
                    autocomplete="off"
                >

            </div>


            <div class="filters-grid">

                <div class="filter-group">

                    <label for="specializationFilter">
                        التخصص
                    </label>

                    <select id="specializationFilter">

                        <option value="">
                            كل التخصصات
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="degreeLevelFilter">
                        الدرجة الدراسية
                    </label>

                    <select id="degreeLevelFilter">

                        <option value="">
                            كل الدرجات
                        </option>

                        <option value="Bachelor">
                            بكالوريوس
                        </option>

                        <option value="Master">
                            ماجستير
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="countryFilter">
                        الدولة
                    </label>

                    <select id="countryFilter">

                        <option value="">
                            كل الدول
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="partnershipFilter">
                        الشراكة
                    </label>

                    <select id="partnershipFilter">

                        <option value="">
                            كل الشراكات
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="universityFilter">
                        الجامعة
                    </label>

                    <select id="universityFilter">

                        <option value="">
                            كل الجامعات
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="scholarshipFilter">
                        دعم الابتعاث
                    </label>

                    <select id="scholarshipFilter">

                        <option value="">
                            الكل
                        </option>

                        <option value="Supported">
                            مدعوم
                        </option>

                        <option value="Not Supported">
                            غير مدعوم
                        </option>

                        <option value="To be confirmed">
                            غير مؤكد
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="button"
                id="resetButton"
            >
                مسح البحث والفلاتر
            </button>

        </section>


        <section
            id="cardsContainer"
            class="results-grid"
        ></section>


        <section
            id="emptyState"
            class="empty-state"
        >

            <h2>
                لا توجد نتائج مطابقة
            </h2>

            <p>
                جرّب كتابة اسم تخصص أو جامعة أخرى أو إزالة بعض الفلاتر.
            </p>

        </section>


        <section
            id="errorState"
            class="error-state"
        >

            <h2>
                حدث خطأ أثناء تحميل البيانات
            </h2>

            <p>
                تأكد من وجود ملف partnerships.json بجوار ملفات الموقع.
            </p>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
